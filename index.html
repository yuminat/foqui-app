function openRules(){document.querySelectorAll('.sheet').forEach(s=>s.remove());sheet(`<h2 class='d'>Regulamento</h2><div class='pol'><h4>1. Quem pode participar</h4><p>A participação é gratuita e não exige compra. Podem participar pessoas com 18 anos ou mais que tenham conta no aplicativo da Foqui. Funcionários da Foqui não concorrem.</p><h4>2. Como montar</h4><p>Na aba Novidades, em “Monte o seu sanduíche”, escolha base, recheio, queijo, frescor, molho e crocância e dê um nome à receita.</p><h4>3. Receitas finalistas</h4><p>As receitas enviadas ficam disponíveis para votação como finalistas. A Foqui pode recusar nomes ou combinações ofensivos, repetidos ou inviáveis na cozinha.</p><h4>4. Votação</h4><p>Cada pessoa tem 1 voto e pode trocá-lo por outra receita até o fim da votação. Votos obtidos por meios automáticos ou fraudulentos são anulados.</p><h4>5. Escolha da receita</h4><p>A receita com mais votos ao fim do período de votação é a vencedora. Em caso de empate, a Foqui escolhe entre as empatadas.</p><h4>6. Prêmio</h4><p>A receita vencedora é vendida apenas na loja física da Foqui, por cerca de 30 dias, com o crédito ao autor. O autor também ganha pontos e uma recompensa definida pela Foqui.</p><h4>7. Uso da receita</h4><p>Ao enviar, você autoriza a Foqui a produzir e vender a receita e a divulgar o seu nome como autor.</p><h4>8. Dados pessoais</h4><p>O tratamento dos dados segue a Política de privacidade do aplicativo.</p><h4>9. Alterações</h4><p>A Foqui pode alterar este regulamento, avisando pelo aplicativo.</p></div>`)}

const votesRow=x=>`<div class='rvotes'><b class='d'>${x.v}</b><span>${x.v===1?'voto':'votos'}</span></div>`;
const finals=()=>{const t=S.ideas.reduce((a,b)=>a+b.v,0)||1;const idx=S.ideas.map((x,i)=>i).sort((a,b)=>{const ma=!!S.ideas[a].mine,mb=!!S.ideas[b].mine;return ma!==mb?(mb-ma):(ma&&mb?b-a:a-b)});return idx.map(i=>{const x=S.ideas[i],pos=1+S.ideas.filter(y=>y.v>x.v).length;return rcard({...x,d:dOf(x,i),tag:x.mine?`Seu lanche · ${pos}º lugar`:''},votesRow(x)+`<div class='bk'><i style='width:${x.v/t*100}%'></i></div>`,`<button class='btn ${S.voted==i?'':'o'}' data-v='${i}' aria-pressed='${S.voted==i}'>${S.voted==i?'Votado':'Votar'}</button>`)}).join('')};
bdMount=function(){const el=document.getElementById('bd');if(!el)return;const n=BLD.length,w=Math.min(S.bw,n),fin=w>=n,c=fin?null:BLD[w];
const head=`<div class='bd-prev'><div id='bdart' style='width:100%;height:100%'>${bdArt(S.bd)}</div><span class='bd-count'>${bdN()} ingredientes</span><div class='bd-side'><button data-rand aria-label='Surpreenda-me' title='Surpreenda-me'>${ic('dice')}</button><button data-clr aria-label='Limpar' title='Limpar'>${ic('eraser')}</button></div></div><div class='wz' aria-hidden='true'>${BLD.map((x,i)=>`<i class='${i<w?'done':i===w?'on':''}'></i>`).join('')}<i class='${fin?'on':''}'></i></div><div class='wzt'><span class='sm'>Etapa ${w+1} de ${n+1}</span><b class='d'>${fin?'Nome e revisão':c.t}</b></div>`;
if(!fin){el.innerHTML=head+`<p class='sm' style='margin-top:6px'>${c.max===1?'Escolha 1':'Escolha até '+c.max}</p><div class='ings'>${c.items.map((x,j)=>`<button class='ing ${S.bd[c.k].includes(j)?'on':''}' aria-pressed='${S.bd[c.k].includes(j)}' data-b='${c.k}:${j}'><i style='background:${x[1]}'></i>${x[0]}</button>`).join('')}</div><div class='wzn'>${w>0?`<button class='btn o' data-bn='-1'>Voltar</button>`:''}<button class='btn' data-bn='1'>${w===n-1?'Revisar':'Continuar'}</button></div>`}
else{el.innerHTML=head+`<label class='sm' for='nm' style='display:block;margin-top:10px'>Nome do sanduíche</label><div class='nmrow'><input id='nm' maxlength='28' placeholder='Ex.: Fugiu do Óbvio' value="${S.nm.replace(/["<>]/g,'')}"><button class='btn o' data-sug>Sugerir</button></div><div class='rx one'>${rcard({n:S.nm||'Dê um nome a ele',d:S.bd},'','')}</div><div class='wzn'><button class='btn o' data-bn='-1'>Voltar</button><button class='btn' data-sub>Enviar para votação</button></div>`}};
document.addEventListener('input',e=>{if(e.target.id==='nm'){const t=document.querySelector('#bd .rn');if(t)t.textContent=S.nm||'Dê um nome a ele'}});
const hIco=l=>/^Resgate/.test(l)?'sealc':/^Partida/.test(l)?'el-omf':/^Boas/.test(l)?'sealp':'el-cup';
const hDay=w=>w==='agora'?'Hoje':w.charAt(0).toUpperCase()+w.slice(1);
const histBlock=()=>{if(!S.hist.length)return `<div class='st2'><span>Histórico</span></div><p class='sm'>Nada por aqui ainda.</p>`;const L=S.hall?S.hist:S.hist.slice(0,4);let last='',o='';L.forEach(x=>{const d=hDay(x[2]);if(d!==last){o+=`<div class='hd'>${d}</div>`;last=d}const up=x[1]>0;o+=`<div class='hr'><span class='hic ${up?'up':'dn'}'>${bi(hIco(x[0]))}</span><div class='ht'><b>${esc(x[0].replace(/^Resgate: /,''))}</b><span class='sm'>${/^Resgate/.test(x[0])?'Resgate de recompensa':up?'Pontos recebidos':'Pontos usados'}</span></div><b class='ha ${up?'up':'dn'}'>${up?'+':'−'}${Math.abs(x[1])} pts</b></div>`});return `<div class='st2'><span>Histórico</span>${S.hist.length>4?`<button class='lnk' data-k='hall'>${S.hall?'Ver menos':'Ver tudo'}</button>`:''}</div><div class='hist'>${o}</div>`};

(()=>{const SEL='#scr .rx,#scr .rwx,#scr .promos,#scr .hx';const _rk=render;render=function(k){const sc=document.getElementById('scr');const y=sc?sc.scrollTop:0;const hs=[...document.querySelectorAll(SEL)].map(e=>e.scrollLeft);_rk(k);if(k&&sc){sc.scrollTop=y;[...document.querySelectorAll(SEL)].forEach((e,i)=>{if(hs[i])e.scrollLeft=hs[i]});requestAnimationFrame(()=>{sc.scrollTop=y})}}})();
function playSplash(){const o=document.getElementById('splash');if(o)o.remove();$('#phone').insertAdjacentHTML('beforeend',SP);const s=$('#splash');s.onclick=()=>s.classList.add('out');setTimeout(()=>s.classList.add('out'),3600)}
playSplash();
render();
</script></body></html>
